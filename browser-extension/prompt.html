<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Download with SolosGame IDM</title>
    <style>
      body {
        font: 14px/1.4 sans-serif;
        margin: 16px;
        width: 370px;
      }
      #url {
        word-break: break-all;
        color: #444;
        font-size: 12px;
      }
      button {
        margin: 12px 8px 0 0;
      }
    </style>
  </head>
  <body>
    <p>Download this file with SolosGame IDM or with Chrome?</p>
    <p id="url"></p>
    <label>
      <input id="remember" type="checkbox" />
      Remember my choice
    </label>
    <div>
      <button id="idm" type="button">Download with SolosGame IDM</button>
      <button id="chrome" type="button">Download normally (Chrome)</button>
    </div>
    <script src="prompt.js"></script>
  </body>
</html>
