name: Windows installer

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      SKIP_ANDROID_BUILD: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: "25"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $found = Get-Command makensis -ErrorAction SilentlyContinue
            if (-not $found) { throw "makensis.exe was not installed" }
            throw "NSIS installed, but not at $makensis (found $($found.Source))"
          }
          & $makensis /VERSION

      - name: Test desktop, shared, and downloader modules
        shell: bash
        run: |
          ./gradlew --stacktrace \
            :desktop:app:test \
            :desktop:app-utils:test \
            :desktop:shared:test \
            :desktop:mac_utils:test \
            :desktop:slf4j-impl:test \
            :downloader:core:desktopTest \
            :downloader:monitor:desktopTest \
            :shared:app:desktopTest \
            :shared:utils:desktopTest \
            :shared:updater:desktopTest \
            :shared:config:test \
            :shared:compose-utils:desktopTest \
            :shared:auto-start:desktopTest \
            :shared:resources:desktopTest \
            :shared:resources:contracts:desktopTest \
            :integration:server:test

      - name: Build Windows installer
        shell: bash
        run: |
          ./gradlew --stacktrace createReleaseFolderForCi
          echo "Installer files:"
          find build/ci-release/binaries -type f -print

      - name: Launch smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Get-ChildItem -Path "build\ci-release\binaries" -Filter "*.exe" |
            Select-Object -First 1
          if (-not $installer) { throw "No installer .exe was produced" }
          if ($installer.Length -lt 1MB) { throw "Installer looks empty: $($installer.Length) bytes" }
          Write-Host "Installer: $($installer.Name) ($($installer.Length) bytes)"

          $appImage = Get-ChildItem -Path "desktop\app\build\compose\binaries" -Filter "SolosGameIDM.exe" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\SolosGameIDMCli\.exe$' } |
            Select-Object -First 1
          if (-not $appImage) { throw "Packaged SolosGameIDM.exe app image was not found" }
          Write-Host "Launching $($appImage.FullName)"

          $env:SKIKO_RENDER_API = "SOFTWARE"
          $app = Start-Process -FilePath $appImage.FullName -PassThru
          Start-Sleep -Seconds 25
          $app.Refresh()
          $running = Get-Process -Name "SolosGameIDM" -ErrorAction SilentlyContinue
          $dataDir = Join-Path $env:USERPROFILE ".solosgame-idm"
          $crash = Join-Path $dataDir "system\log\crash.log"
          $hsErr = @()
          if (Test-Path $dataDir) {
            $hsErr = @(Get-ChildItem -Path $dataDir -Filter "hs_err_pid*.log" -Recurse -ErrorAction SilentlyContinue)
          }
          $hsErr += @(Get-ChildItem -Path $appImage.DirectoryName -Filter "hs_err_pid*.log" -ErrorAction SilentlyContinue)
          if (Test-Path $crash) {
            Write-Host "---- crash.log ----"
            Get-Content $crash -Raw
            throw "crash.log was written"
          }
          if ($hsErr) {
            $hsErr | ForEach-Object { Write-Host $_.FullName; Get-Content $_.FullName -TotalCount 40 }
            throw "JVM crash log found"
          }
          if ($app.HasExited -or -not $running) {
            $code = if ($app.HasExited) { $app.ExitCode } else { "still-starting" }
            $logDir = Join-Path $dataDir "system\log"
            if (Test-Path $logDir) {
              Get-ChildItem $logDir -File -ErrorAction SilentlyContinue | ForEach-Object {
                Write-Host "---- $($_.FullName) ----"
                Get-Content $_.FullName -Raw
              }
            }
            throw "SolosGameIDM.exe is not running after 25 seconds (exit=$code)"
          }
          Write-Host "SolosGameIDM is running (pid $($running.Id -join ', '))"

          $sample = node browser-extension/test/print-ci-request.js | ConvertFrom-Json
          Write-Host "POST $($sample.endpoint) body=$($sample.body)"
          $ok = $false
          $lastError = ""
          foreach ($try in 1..8) {
            try {
              $resp = Invoke-WebRequest -Uri $sample.endpoint -Method POST `
                -ContentType "application/json; charset=utf-8" `
                -Body $sample.body `
                -UseBasicParsing
              $text = "$($resp.Content)".Trim()
              Write-Host "integration try $try status=$($resp.StatusCode) body=$text"
              if ($resp.StatusCode -eq 200 -and $text -eq "OK") {
                $ok = $true
                break
              }
              $lastError = "status=$($resp.StatusCode) body=$text"
            } catch {
              $lastError = $_.Exception.Message
              Write-Host "integration try $try failed: $lastError"
              Start-Sleep -Seconds 2
            }
          }
          if (-not $ok) { throw "Integration POST /add did not return OK: $lastError" }

          Stop-Process -Name "SolosGameIDM" -Force -ErrorAction SilentlyContinue
          Get-Process -Name "SolosGameIDMCli","SolosGameIDMNativeMessagingHost" -ErrorAction SilentlyContinue |
            Stop-Process -Force

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SolosGame-IDM-windows-installer
          path: build/ci-release/binaries/*.exe
          if-no-files-found: error

  extension:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate extension
        run: node --test browser-extension/test/request.test.js

      - name: Package extension
        run: |
          zip -r SolosGame-IDM-chrome-extension.zip \
            manifest.json background.js request.js options.html options.js prompt.html prompt.js icons \
            -x "test/*"
          unzip -l SolosGame-IDM-chrome-extension.zip
        working-directory: browser-extension

      - name: Upload extension
        uses: actions/upload-artifact@v4
        with:
          name: SolosGame-IDM-chrome-extension
          path: browser-extension/SolosGame-IDM-chrome-extension.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, extension]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: SolosGame-IDM-windows-installer
          path: release-assets

      - name: Validate extension and package release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --test browser-extension/test/request.test.js
          $version = "${{ github.ref_name }}"
          if ($version.StartsWith("v")) { $version = $version.Substring(1) }
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "tag version must look like 1.0.0, got $version" }

          $exe = Get-ChildItem release-assets -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "installer exe missing from the windows job" }
          $setupName = "SolosGameIDM-Setup-$version-x64.exe"
          Copy-Item $exe.FullName (Join-Path release-assets $setupName)
          Remove-Item $exe.FullName
          $setup = Get-Item (Join-Path release-assets $setupName)
          if ($setup.Length -lt 1MB) { throw "installer is too small" }

          $extName = "SolosGameIDM-Chrome-Extension-$version.zip"
          $extZip = Join-Path release-assets $extName
          tar.exe -a -c -f $extZip -C browser-extension manifest.json background.js request.js options.html options.js prompt.html prompt.js icons
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead($extZip)
          try {
            $names = @($zip.Entries | ForEach-Object { $_.FullName.Replace('\','/') })
          } finally {
            $zip.Dispose()
          }
          Write-Host ($names -join "`n")
          if ($names -notcontains "manifest.json") { throw "extension zip is missing manifest.json" }
          if ($names | Where-Object { $_ -like "*.zip" }) { throw "extension zip contains another zip" }

          @"
          ## Install SolosGame IDM $version

          ### Windows app
          1. Download ``$setupName`` and run it.
          2. Windows SmartScreen warns because this installer is unsigned. Click **More info**, then **Run anyway**.

          ### Chrome extension
          1. Download ``$extName`` and unzip it (one zip; the folder inside has manifest.json).
          2. Open ``chrome://extensions``.
          3. Turn on **Developer mode**.
          4. Click **Load unpacked** and select the unzipped folder.

          SolosGame IDM is based on [AB Download Manager](https://github.com/amir1376/ab-download-manager) by amir1376, licensed under Apache-2.0.
          "@ | Set-Content -Encoding utf8NoBOM release-notes.md

          Get-ChildItem release-assets | Format-Table Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SolosGame IDM ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-assets/SolosGameIDM-Setup-*-x64.exe
            release-assets/SolosGameIDM-Chrome-Extension-*.zip
